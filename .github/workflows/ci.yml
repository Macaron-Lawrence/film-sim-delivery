name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  selftest:
    name: self-test (${{ matrix.os }} / py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Syntax check every Python entry point
        run: python -c "import ast,glob,sys; [ast.parse(open(f,encoding='utf-8').read(),f) for f in glob.glob('scripts/*.py')+glob.glob('evals/*.py')]; print('AST OK')"
      - name: End-to-end self-test (build LUT -> calibrate -> encode -> decode -> assert)
        run: python scripts/selftest.py
      - name: Regenerate synthetic fixtures and assert their defect signatures
        run: python evals/make_fixtures.py --out evals/fixtures
