name: ci

on:
  push:
    branches: ["**"]      # 分支推送触发；tag 不触发（tag 只是发布标记，不必再跑一遍）
    tags-ignore: ["**"]
  pull_request:
  workflow_dispatch:

env:
  # Windows 的重定向控制台默认是 cp1252；脚本内部也各自固定了 UTF-8，这里是双保险
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  selftest:
    name: self-test (${{ matrix.os }} / py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # 3.9 是声明的最低支持版本；3.12 代表当前主流
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Syntax check every Python entry point
        run: python -c "import ast,glob; [ast.parse(open(f,encoding='utf-8').read(),f) for f in glob.glob('scripts/*.py')+glob.glob('evals/*.py')]; print('AST OK')"
      - name: End-to-end self-test (build LUT -> calibrate -> encode -> decode -> assert)
        run: python scripts/selftest.py
      - name: Regenerate synthetic fixtures and assert their defect signatures
        run: python evals/make_fixtures.py --out evals/fixtures
      - name: Fixtures are byte-reproducible
        run: python evals/make_fixtures.py --verify-reproducible
